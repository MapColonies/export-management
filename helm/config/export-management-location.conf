# export-management proxy settings, included in the common nginx root location (after auth_request)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_pass http://{{ include "service.fullname" . | trim }}:{{ .Values.servicePort }};
