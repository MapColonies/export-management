{{- if .Values.nginx.enabled -}}
{{- $chartName := include "export-management.name" . -}}
{{- $releaseName := .Release.Name -}}
{{- $nginxConfigmapName := include "nginx-configmap.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nginxConfigmapName }}
  labels:
    app: {{ $releaseName }}-{{ $chartName }}
    component: nginx-configmap
    environment: {{ include "export-management.environment" . }}
    release: {{ $releaseName }}
data:
  export-management-server.conf: {{ tpl (.Files.Get "config/export-management-server.conf") . | quote }}
  export-management-location.conf: {{ tpl (.Files.Get "config/export-management-location.conf") . | quote }}
{{- end }}
