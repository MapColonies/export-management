global:
  cloudProvider:
    dockerRegistryUrl: my-registry-url.io
    imagePullSecretName: 'my-registry-secret'
    flavor: openshift
  tracing: {}
  metrics: {}
  environment: ""

mclabels:
  #environment: development
  component: backend
  partOf: core
  owner: raster
  gisDomain: raster
  prometheus:
    enabled: true
    port: 8080

enabled: true
environment: development
replicaCount: 1
initialDelaySeconds: 60
resetOnConfigChange: true
imagePullPolicy: Always

cloudProvider:
  dockerRegistryUrl: my-registry-url.io
  imagePullSecretName: 'my-registry-secret'
  flavor: openshift

authentication:
  ssl:
    enabled: false
    useExternal: false
    externalSecretName: ""

caSecretName: ''
caPath: '/usr/local/share/ca-certificates'
caKey: 'ca.crt'

image:
  repository: export-management
  tag: 'latest'

targetPort: 8080
internalServicePort: 80
servicePort: 8080 
nodePort: 30018 

serviceUrls:
  exporterTrigger: "http://raster-dev-exporter-trigger-service"
  jobManager: "http://raster-dev-job-manager"
jobManagement:
    exporter:
      jobType: tilesExport

env:
  protocol: TCP
  logLevel: "info"
  logPrettyPrintEnabled: false
  responseCompressionEnabled: true
  disableHttpClientLogs: false
  requestPayloadLimit: 10mb
  serviceWebhookEndpoint: https://export-management/export-tasks/webhook/
  tracing:
    enabled: false
    url: http://localhost:55681/v1/trace
  metrics:
    enabled: false
    url: http://localhost:55681/v1/metrics
  httpRetry:
    attempts: 5
    delay: exponential
    shouldResetTimeout: true

resources:
  enabled: true
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi


nginx:
  enabled: true
  # Keeps the existing nginx service/route names
  fullnameOverride: "export-management-export-management-nginx"
  replicaCount: 2
  image:
    repository: common/nginx
    # defaults to the nginx chart appVersion when empty
    # tag: ""
  mclabels:
    #environment: development
    component: proxy-server
    partOf: core
    owner: raster
    gisDomain: raster
    logScraping: true
    prometheus:
      enabled: true
  nginx:
    extensions:
      server:
        enabled: true
        fileName: export-management-server.conf
      location:
        enabled: true
        fileName: export-management-location.conf
    # export-management API: GET + POST (CORS preflight Access-Control-Allow-Methods)
    allowedMethods: "GET, POST, OPTIONS"
  port: 8080
  internalServicePort: 80
  targetPort: 8080
  nodePort: 30003
  # rendered into config/export-management-server.conf (client_max_body_size)
  clientMaxBodySize: 5000

  opentelemetry:
    serviceName: export-management-nginx
    exporterHost: infra-otel.infra-services
    exporterPort: 4317
    samplerMethod: "AlwaysOff"
    ratio: 10

  # proxy_pass to the export-management service is rendered in config/export-management-location.conf
  backend:
    enabled: false

  authorization:
    enabled: true
    domain: "rasterExport"
    url: http://opa-dev-opa-service.infra-services/v1/data/http/authz/decision

  extraVolumes:
    - name: nginx-config
      configMap:
        name: '{{ .Release.Name }}-export-management-nginx-configmap'

  extraVolumeMounts:
    - name: nginx-config
      mountPath: "/etc/nginx/conf.d/extensions/export-management-server.conf"
      subPath: export-management-server.conf
    - name: nginx-config
      mountPath: "/etc/nginx/conf.d/extensions/export-management-location.conf"
      subPath: export-management-location.conf

  resources:
    enabled: true
    value:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

  route:
    enabled: true
    routesMapping:
      - path: /
        host:
    timeout:
      enabled: false # defaults to 30s by openshift
      duration: 60s # supported units (us, ms, s, m, h, d)
    tls:
      enabled: true
      useCerts: false
      certificate: ""
      key: ""
      caCertificate: ""

  ingress:
    enabled: false
    ingressClassName: ""
    ingressMapping:
      - path: /api/raster/v1
        host: "localhost"
        pathType: Prefix
    tls:
      enabled: true
      useExternal: ""
